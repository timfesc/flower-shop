<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Цветочный магазин</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="app"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [formData, setFormData] = useState({
        flowerType: '',
        quantity: '1',
        color: '',
        occasion: '',
        customerName: '',
        customerPhone: '',
        deliveryDate: ''
      });

      const [submitted, setSubmitted] = useState(false);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const flowerTypes = [
        'Розы',
        'Тюльпаны',
        'Гвоздики',
        'Лилии',
        'Подсолнухи',
        'Пионы',
        'Орхидеи',
        'Хризантемы',
        'Гербера',
        'Ромашки',
        'Лаванда',
        'Анемоны',
        'Ирисы',
        'Астры',
        'Флоксы',
        'Букет микс',
        'Композиция свежих цветов',
        'Букет невесты'
      ];

      const occasions = [
        'День рождения',
        'Свадьба',
        'Юбилей',
        'День влюбленных',
        'Восьмое марта',
        'Похороны',
        'Извинения',
        'Поздравления',
        'Просто так',
        'Помолвка',
        'Годовщина',
        'Выпускной'
      ];

      const colors = [
        'Красный',
        'Розовый',
        'Белый',
        'Желтый',
        'Оранжевый',
        'Фиолетовый',
        'Голубой',
        'Кремовый',
        'Персиковый',
        'Микс цветов'
      ];

      const quantities = ['1', '3', '5', '7', '9', '11', '15', '21', '25', '51', '101'];
      
      // Get tomorrow's date as minimum
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      const minDate = tomorrow.toISOString().split('T')[0];
      
      // Get date 30 days from now as maximum
      const maxDate = new Date();
      maxDate.setDate(maxDate.getDate() + 30);
      const maxDateStr = maxDate.toISOString().split('T')[0];

      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => ({ ...prev, [name]: value }));
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');

        try {
          const response = await fetch('/api/send-email', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              customerName: formData.customerName,
              customerPhone: formData.customerPhone,
              flowerType: formData.flowerType,
              quantity: formData.quantity,
              color: formData.color,
              occasion: formData.occasion,
              deliveryDate: formData.deliveryDate,
              submissionTime: new Date().toLocaleString('ru-RU')
            })
          });

          if (!response.ok) throw new Error('Failed');
          
          setSubmitted(true);
          setTimeout(() => {
            setFormData({ 
              flowerType: '', 
              quantity: '1', 
              color: '', 
              occasion: '', 
              customerName: '', 
              customerPhone: '',
              deliveryDate: ''
            });
            setSubmitted(false);
          }, 3000);
        } catch (err) {
          setError('Ошибка при отправке. Попробуйте еще раз.');
        }
        setLoading(false);
      };

      if (submitted) {
        return (
          <div className="min-h-screen bg-pink-950 flex items-center justify-center p-4">
            <div className="text-center">
              <h1 className="text-3xl font-semibold text-pink-100 mb-2">✓ Заказ принят</h1>
              <p className="text-pink-300 mb-2">Спасибо за вашу заявку!</p>
              <p className="text-pink-200 font-medium text-lg mb-6">🌹 {formData.quantity} {formData.flowerType}</p>
              <p className="text-pink-400">Мы свяжемся с вами по номеру {formData.customerPhone}</p>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-gradient-to-b from-pink-950 via-slate-900 to-pink-950 text-slate-50">
          <header className="border-b border-pink-800 sticky top-0 bg-pink-950 z-50">
            <div className="max-w-5xl mx-auto px-4 sm:px-6 py-4 flex items-center gap-3">
              <h1 className="text-lg sm:text-xl font-semibold text-pink-100">🌸 Цветочный магазин</h1>
            </div>
          </header>

          <main className="max-w-5xl mx-auto px-4 sm:px-6 py-8 sm:py-12">
            <section className="mb-12">
              <h2 className="text-2xl font-semibold text-pink-100 mb-6">Оформить заказ</h2>
              
              {error && <div className="mb-6 p-4 bg-red-900/20 border border-red-800 rounded-lg text-red-400 text-sm">{error}</div>}
              
              <form onSubmit={handleSubmit} className="space-y-6">
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                  <div>
                    <label className="block text-sm font-medium text-pink-300 mb-2">Цветы</label>
                    <select name="flowerType" value={formData.flowerType} onChange={handleChange} required className="w-full px-4 py-3 bg-slate-900 border border-pink-700 rounded-lg text-slate-100 focus:outline-none focus:border-pink-500">
                      <option value="">Выберите цветы...</option>
                      {flowerTypes.map(f => <option key={f} value={f}>{f}</option>)}
                    </select>
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-pink-300 mb-2">Количество</label>
                    <select name="quantity" value={formData.quantity} onChange={handleChange} required className="w-full px-4 py-3 bg-slate-900 border border-pink-700 rounded-lg text-slate-100 focus:outline-none focus:border-pink-500">
                      {quantities.map(q => <option key={q} value={q}>{q} шт.</option>)}
                    </select>
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-pink-300 mb-2">Цвет</label>
                    <select name="color" value={formData.color} onChange={handleChange} required className="w-full px-4 py-3 bg-slate-900 border border-pink-700 rounded-lg text-slate-100 focus:outline-none focus:border-pink-500">
                      <option value="">Выберите цвет...</option>
                      {colors.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-pink-300 mb-2">По случаю</label>
                    <select name="occasion" value={formData.occasion} onChange={handleChange} required className="w-full px-4 py-3 bg-slate-900 border border-pink-700 rounded-lg text-slate-100 focus:outline-none focus:border-pink-500">
                      <option value="">Выберите случай...</option>
                      {occasions.map(o => <option key={o} value={o}>{o}</option>)}
                    </select>
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-pink-300 mb-2">Дата доставки</label>
                    <input 
                      type="date" 
                      name="deliveryDate" 
                      value={formData.deliveryDate} 
                      onChange={handleChange} 
                      required 
                      min={minDate}
                      max={maxDateStr}
                      className="w-full px-4 py-3 bg-slate-900 border border-pink-700 rounded-lg text-slate-100 focus:outline-none focus:border-pink-500"
                    />
                  </div>
                </div>

                <div className="border-t border-pink-800 pt-6">
                  <h3 className="text-sm font-semibold text-pink-300 mb-6">Ваши контактные данные</h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <input 
                      type="text" 
                      name="customerName" 
                      value={formData.customerName} 
                      onChange={handleChange} 
                      required 
                      placeholder="Ваше имя" 
                      className="px-4 py-3 bg-slate-900 border border-pink-700 rounded-lg text-slate-100 placeholder-slate-600 focus:outline-none focus:border-pink-500"
                    />
                    <input 
                      type="tel" 
                      name="customerPhone" 
                      value={formData.customerPhone} 
                      onChange={handleChange} 
                      required 
                      placeholder="Телефон" 
                      className="px-4 py-3 bg-slate-900 border border-pink-700 rounded-lg text-slate-100 placeholder-slate-600 focus:outline-none focus:border-pink-500"
                    />
                  </div>
                </div>

                <button 
                  type="submit" 
                  disabled={loading} 
                  className="w-full mt-8 px-8 py-3 bg-gradient-to-r from-pink-500 to-rose-500 text-white rounded-lg hover:from-pink-600 hover:to-rose-600 disabled:opacity-50 font-medium transition"
                >
                  {loading ? 'Отправка...' : '✓ Заказать букет'}
                </button>
              </form>
            </section>

            <section className="border-t border-pink-800 pt-12">
              <h2 className="text-2xl font-semibold text-pink-100 mb-6">О нас</h2>
              
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-8">
                <div>
                  <div className="text-3xl font-semibold text-pink-300 mb-2">🌹</div>
                  <p className="text-pink-200">Свежие цветы ежедневно</p>
                </div>
                <div>
                  <div className="text-3xl font-semibold text-pink-300 mb-2">🚚</div>
                  <p className="text-pink-200">Быстрая доставка</p>
                </div>
                <div>
                  <div className="text-3xl font-semibold text-pink-300 mb-2">💝</div>
                  <p className="text-pink-200">Красивая упаковка</p>
                </div>
              </div>

              <div className="space-y-3">
                <div className="flex items-start gap-3">
                  <span className="text-pink-500 mt-0.5">✓</span>
                  <p className="text-pink-300">Букеты собираются профессиональными флористами</p>
                </div>
                <div className="flex items-start gap-3">
                  <span className="text-pink-500 mt-0.5">✓</span>
                  <p className="text-pink-300">Доставка по городу в день заказа</p>
                </div>
                <div className="flex items-start gap-3">
                  <span className="text-pink-500 mt-0.5">✓</span>
                  <p className="text-pink-300">Гарантия свежести цветов</p>
                </div>
              </div>
            </section>
          </main>

          <footer className="border-t border-pink-800 mt-12 py-6 bg-pink-950">
            <div className="max-w-5xl mx-auto px-4 sm:px-6 text-center text-pink-400 text-sm">
              <p>© 2025 Цветочный магазин. Все права защищены. | С любовью для вас 🌸</p>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('app'));
    root.render(<App />);
  </script>
</body>
</html>
